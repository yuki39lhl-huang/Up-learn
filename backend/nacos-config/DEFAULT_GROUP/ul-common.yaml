# 共享配置：JWT / RabbitMQ 默认 / Redis 占位 / 日志
# DataId: ul-common.yaml · Group: DEFAULT_GROUP
# 密钥与本机端口仍由各服务 application-local.yml（或环境变量）覆盖

spring:
  data:
    redis:
      host: ${ul.redis.host:localhost}
      port: ${ul.redis.port:6379}
  rabbitmq:
    host: ${ul.rabbitmq.host:localhost}
    port: ${ul.rabbitmq.port:5672}
    username: ${ul.rabbitmq.username:uplearn}
    password: ${ul.rabbitmq.password:1234}

logging:
  level:
    '[com.yukimomo]': debug
  pattern:
    dateformat: HH:mm:ss:SSS

ul:
  jwt:
    secret: up-learn-dev-jwt-secret-key-change-in-production!!
    access-ttl-ms: 1800000
    refresh-ttl-seconds: 604800
  rabbitmq:
    host: localhost
    port: 5672
    username: uplearn
    password: "1234"
