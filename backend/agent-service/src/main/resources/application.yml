server:
  port: 8085

spring:
  application:
    name: agent-service
  profiles:
    active: dev
  config:
    import:
      # agent 排除了 DataSource，不要引 ul-datasource
      - optional:nacos:ul-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: localhost:8858
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        ephemeral: true
