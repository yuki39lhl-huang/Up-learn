# 本地仅保留：端口 / 服务名 / profile / Nacos 连接与拉配置清单
# 业务配置见 Nacos（backend/nacos-config），本机密钥见 application-local.yml
server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:ul-common.yaml
      - optional:nacos:ul-datasource.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: localhost:8858
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        ephemeral: true
