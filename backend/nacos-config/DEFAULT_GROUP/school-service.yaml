# DataId: school-service.yaml

spring:
  elasticsearch:
    uris: ${ul.school.elasticsearch-uris:http://localhost:9200}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: logs/school-service.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.yukimomo.school.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

ul:
  school:
    es-enabled: true
    elasticsearch-uris: http://localhost:9200
