# 带库服务共享：MySQL + MyBatis-Plus 通用项
# DataId: ul-datasource.yaml · Group: DEFAULT_GROUP
# 仅 user / school / practice / community 引入（gateway / agent 不要引）
# 逻辑删除由各实体 @TableLogic 或服务级 yaml 声明

spring:
  datasource:
    url: jdbc:mysql://${ul.db.host}:${ul.db.port}/up_learn?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ul.db.pw}

mybatis-plus:
  global-config:
    db-config:
      update-strategy: not-null
      id-type: auto
