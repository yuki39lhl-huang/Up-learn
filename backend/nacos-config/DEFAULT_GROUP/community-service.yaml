# DataId: community-service.yaml

spring:
  elasticsearch:
    uris: ${ul.community.elasticsearch-uris:http://localhost:9200}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: logs/community-service.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.yukimomo.community.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

ul:
  community:
    es-enabled: true
    elasticsearch-uris: http://localhost:9200
    mq-enabled: true
