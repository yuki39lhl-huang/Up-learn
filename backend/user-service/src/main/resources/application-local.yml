# profile=local：IDEA 本机启动，连 Docker 映射端口
# 密钥只写本机，勿提交真实 AccessKey / 邮箱授权码
spring:
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    username: ""
    password: ""

ul:
  db:
    host: localhost
    port: 3308
    pw: 1234
  redis:
    host: localhost
    port: 6380
  login:
    # 本机真发信时改为 false，并填写上方 spring.mail
    dev-log-code: true
  oss:
    enabled: false
    bucket: uplearn
    public-base-url: https://uplearn.oss-cn-beijing.aliyuncs.com
    access-key-id: ""
    access-key-secret: ""
