server:
  port: 8084

spring:
  application:
    name: practice-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${ul.db.host}:${ul.db.port}/up_learn?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ul.db.pw}
  cloud:
    nacos:
      server-addr: localhost:8858
      username: nacos
      password: nacos
      discovery:
        ephemeral: true
  data:
    redis:
      host: ${ul.redis.host}
      port: ${ul.redis.port}

mybatis-plus:
  global-config:
    db-config:
      update-strategy: not-null
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    '[com.yukimomo]': debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: logs/practice-service.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.yukimomo.practice.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
