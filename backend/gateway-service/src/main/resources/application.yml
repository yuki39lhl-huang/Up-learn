server:
  port: 8082

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import:
      # gateway 无库，只拉公共 JWT + 本服务路由
      - optional:nacos:ul-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: localhost:8858
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        ephemeral: true
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
